<svg viewBox="-10 -10 1020 305" width="1020" height="305" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gateway request pipeline">
  <style>
text{text-anchor:middle;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.box{fill:#fff;stroke:#1f3a5f;stroke-width:1.5}.box-accent{fill:#1f3a5f;stroke:#1f3a5f}
.box-ext{fill:#eef6f3;stroke:#0e7c66;stroke-width:1.5}.box-err{fill:#fef3f2;stroke:#b42318;stroke-width:1.3}
.boundary{fill:#f5f7fa;stroke:#98a2b3;stroke-width:1.2;stroke-dasharray:6 4}.db{fill:#e9eef5;stroke:#1f3a5f;stroke-width:1.5}
.ln{fill:none;stroke:#1f3a5f;stroke-width:1.5}.ln-ext{fill:none;stroke:#0e7c66;stroke-width:1.5}
.ln-err{fill:none;stroke:#b42318;stroke-width:1.3;stroke-dasharray:4 3}
.tb{font-size:14px;font-weight:600;fill:#101828}.ts{font-size:11.5px;fill:#475467}
.tm{font-size:10.5px;font-family:Menlo,Consolas,monospace;fill:#1f3a5f}.tw{fill:#fff}.tw2{fill:#c7d4e4}
.terr{fill:#b42318}.tlabel{font-size:11px;fill:#667085;font-style:italic}.tleft{text-anchor:start}
</style>
  <rect x="-10" y="-10" width="1020" height="305" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="ah-gw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f3a5f"/></marker>
    <marker id="ah-gw-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b42318"/></marker>
    <marker id="ah-gw-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e7c66"/></marker>
  </defs>

  <!-- response path -->
  <path class="ln-ext" d="M935 88 V40 H65 V86" marker-end="url(#ah-gw-ext)"/>
  <text class="tlabel" x="500" y="32">response passed back to the client unchanged (status, headers, body) + X-Request-Id</text>

  <rect class="box-ext" x="10" y="90" width="110" height="64" rx="8"/>
  <text class="tb" x="65" y="119">Client</text>
  <text class="ts" x="65" y="138">app / browser</text>

  <rect class="box" x="160" y="90" width="150" height="64" rx="8"/>
  <text class="tb" x="235" y="114">1. API key</text>
  <text class="ts" x="235" y="132">x-api-key header</text>
  <text class="ts" x="235" y="147">must be a known key</text>

  <rect class="box" x="340" y="90" width="150" height="64" rx="8"/>
  <text class="tb" x="415" y="114">2. Rate limit</text>
  <text class="ts" x="415" y="132">100 requests / 15 min</text>
  <text class="ts" x="415" y="147">per API key</text>

  <rect class="box" x="520" y="90" width="150" height="64" rx="8"/>
  <text class="tb" x="595" y="114">3. Route</text>
  <text class="tm" x="595" y="132">/api/&lt;service&gt;/*</text>
  <text class="ts" x="595" y="147">→ matching service</text>

  <rect class="box" x="700" y="90" width="150" height="64" rx="8"/>
  <text class="tb" x="775" y="114">4. Forward</text>
  <text class="ts" x="775" y="132">strip /api prefix,</text>
  <text class="ts" x="775" y="147">10 s timeout</text>

  <rect class="box-accent" x="880" y="90" width="110" height="64" rx="8"/>
  <text class="tb tw" x="935" y="119">Service</text>
  <text class="ts tw2" x="935" y="138">user, vehicle, …</text>

  <line class="ln" x1="120" y1="122" x2="158" y2="122" marker-end="url(#ah-gw)"/>
  <line class="ln" x1="310" y1="122" x2="338" y2="122" marker-end="url(#ah-gw)"/>
  <line class="ln" x1="490" y1="122" x2="518" y2="122" marker-end="url(#ah-gw)"/>
  <line class="ln" x1="670" y1="122" x2="698" y2="122" marker-end="url(#ah-gw)"/>
  <line class="ln" x1="850" y1="122" x2="878" y2="122" marker-end="url(#ah-gw)"/>

  <!-- rejections -->
  <line class="ln-err" x1="235" y1="154" x2="235" y2="203" marker-end="url(#ah-gw-err)"/>
  <line class="ln-err" x1="415" y1="154" x2="415" y2="203" marker-end="url(#ah-gw-err)"/>
  <line class="ln-err" x1="595" y1="154" x2="595" y2="203" marker-end="url(#ah-gw-err)"/>
  <line class="ln-err" x1="775" y1="154" x2="775" y2="203" marker-end="url(#ah-gw-err)"/>
  <text class="tlabel tleft" x="243" y="184">missing / wrong</text>
  <text class="tlabel tleft" x="423" y="184">too many</text>
  <text class="tlabel tleft" x="603" y="184">no match</text>
  <text class="tlabel tleft" x="783" y="184">down / slow</text>

  <rect class="box-err" x="160" y="205" width="150" height="66" rx="8"/>
  <text class="tb terr" x="235" y="229">401</text>
  <text class="tm" x="235" y="247">MISSING_API_KEY</text>
  <text class="tm" x="235" y="262">INVALID_API_KEY</text>

  <rect class="box-err" x="340" y="205" width="150" height="66" rx="8"/>
  <text class="tb terr" x="415" y="229">429</text>
  <text class="tm" x="415" y="247">RATE_LIMITED</text>
  <text class="ts" x="415" y="262">+ Retry-After header</text>

  <rect class="box-err" x="520" y="205" width="150" height="66" rx="8"/>
  <text class="tb terr" x="595" y="229">404</text>
  <text class="tm" x="595" y="247">NOT_FOUND</text>
  <text class="ts" x="595" y="262">unknown / internal route</text>

  <rect class="box-err" x="700" y="205" width="150" height="66" rx="8"/>
  <text class="tb terr" x="775" y="229">503 / 504</text>
  <text class="tm" x="775" y="247">SERVICE_UNAVAILABLE</text>
  <text class="tm" x="775" y="262">GATEWAY_TIMEOUT</text>
</svg>

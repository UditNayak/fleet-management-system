openapi: 3.0.3
info:
  title: Fleet Management System API
  version: 1.0.0
  description: |
    Backend for a fleet management platform, exposed through an **Express API Gateway**.

    ### How to call the API
    1. Every `/api/*` request needs an **API key** in the `x-api-key` header.
       Click **Authorize** above and enter your key (local default: `fleet-dev-key-123`).
    2. Endpoints that also list **BearerAuth** need a JWT (`Authorization: Bearer <token>`),
       obtained from `POST /api/users/login`. In **Authorize**, paste the token (without "Bearer").

    ### Roles
    | Role | Can |
    |---|---|
    | `admin` | everything, including user management |
    | `fleet_manager` | manage vehicles, receive SMS alerts |
    | `driver` | own profile, submit telemetry |

    Public sign-up (`/api/users/register`) always creates a `driver`; only an admin can assign other roles.

    #### Vehicle permissions
    | Action | admin | fleet_manager | driver |
    |---|:-:|:-:|:-:|
    | List / view vehicles | ✅ | ✅ | ✅ |
    | Register, update, change status | ✅ | ✅ | ❌ |
    | Delete | ✅ | ❌ | ❌ |

    Without a token → **401**; with a token but the wrong role → **403 `FORBIDDEN`**.

    ### SMS notifications
    When a vehicle's status changes, every active **admin**, **fleet manager** and the vehicle's **assigned driver**
    (with a phone number) gets an SMS through a **mock SMS provider**: nothing is really sent, the SMS is written to
    the notification-service log. Phone numbers ending in **`0000`** fail on purpose, to demonstrate `failed` records.
    Every SMS is stored with its delivery status (`sent` / `failed`) and can be read under **Notifications**.
    Services call each other on `/internal/*` endpoints, which the gateway never exposes (always **404**).

    ### Telemetry & critical-event alerts
    Vehicles report GPS position and sensor readings to `POST /api/telemetry`. Each reading is stored and the
    vehicle's `location` / `lastSeenAt` are updated (late readings never move a vehicle backwards).
    A **critical event** (`engine_fault`, `low_battery`, `emergency_stop`) sends an SMS alert to all admins and
    fleet managers, at most **once per vehicle and event every 5 minutes** (cooldown). Drivers can only report for
    and read their own (assigned) vehicle.

    ### Geolocation (OpenStreetMap)
    Addresses are turned into coordinates with **OpenStreetMap Nominatim** (free, no API key). Following its usage
    policy, maps-service identifies itself with a User-Agent, sends **at most 1 request per second** and **caches**
    answers for 24 h (`cached: true`). `GET /api/maps/nearby` finds vehicles **within X km** of a point or an address,
    nearest first, with the distance (MongoDB `$geoNear` on a 2dsphere index). A vehicle registered with only an
    `address` gets its coordinates looked up automatically (`locationSource: geocoded`); if that fails the vehicle is
    still saved and `geocoding.status` says why. All maps endpoints are open to **every role**.

    ### Gateway routing
    | Gateway route | Target service |
    |---|---|
    | `/api/users/*` | User Service |
    | `/api/vehicles/*` | Vehicle/Fleet Service |
    | `/api/telemetry/*` | Telemetry Service |
    | `/api/maps/*` | Geolocation Service |
    | `/api/notifications/*` | Notification Service |

    The `/api/<service>` prefix is stripped before forwarding, e.g. `GET /api/vehicles/42` → vehicle-service `GET /42`.

    ### Rate limiting
    Each API key may send a limited number of requests per window (default **100 per 15 minutes**).
    Every response includes `RateLimit` and `RateLimit-Policy` headers; over the limit the gateway answers **429**
    with a `Retry-After` header.

    ### Errors
    All errors share one shape: `{ "error": { "code": "...", "message": "...", "details": ... } }`.
    Every response carries an `X-Request-Id` header for tracing.
servers:
  - url: http://localhost:3000
    description: Local (Docker Compose)
tags:
  - name: Health
    description: Public status endpoints (no API key)
  - name: Gateway
    description: Requests routed through the gateway to backend services
  - name: Users
    description: Registration, login (JWT), profile and admin user management
  - name: Vehicles
    description: Register and manage fleet vehicles, operational status and history (role-based)
  - name: Notifications
    description: SMS delivery log (sent / failed) for admins and fleet managers
  - name: Telemetry
    description: GPS / sensor readings from vehicles, history and critical-event alerts
  - name: Maps
    description: Geocoding with OpenStreetMap Nominatim and nearby-vehicle search (any role)
paths:
  /health:
    get:
      tags: [Health]
      summary: Gateway health check
      description: Public endpoint, no API key required.
      security: []
      responses:
        '200':
          description: Gateway is up
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                service: gateway
                db: not_used
                uptime: 42.7
                timestamp: '2026-11-12T10:00:00.000Z'

  /health/services:
    get:
      tags: [Health]
      summary: Status of every backend service
      description: |
        Public endpoint. The gateway calls `/health` on each of the 5 services in parallel
        (2 s timeout each). Returns **503** if any service is down or degraded.
      security: []
      responses:
        '200':
          description: All services are up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicesHealth'
              example:
                status: ok
                services:
                  - { name: user-service, status: up, db: connected, responseTimeMs: 4 }
                  - { name: vehicle-service, status: up, db: connected, responseTimeMs: 3 }
                  - { name: telemetry-service, status: up, db: connected, responseTimeMs: 3 }
                  - { name: maps-service, status: up, db: connected, responseTimeMs: 5 }
                  - { name: notification-service, status: up, db: connected, responseTimeMs: 4 }
                timestamp: '2026-11-12T10:00:00.000Z'
        '503':
          description: At least one service is down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicesHealth'
              example:
                status: degraded
                services:
                  - { name: user-service, status: up, db: connected, responseTimeMs: 4 }
                  - { name: vehicle-service, status: down, responseTimeMs: 12 }
                  - { name: telemetry-service, status: up, db: connected, responseTimeMs: 3 }
                  - { name: maps-service, status: up, db: connected, responseTimeMs: 5 }
                  - { name: notification-service, status: up, db: connected, responseTimeMs: 4 }
                timestamp: '2026-11-12T10:00:00.000Z'

  /api/{service}/health:
    get:
      tags: [Gateway]
      summary: Health of one backend service, routed through the gateway
      description: |
        Demonstrates gateway routing: the request passes API key verification and rate limiting,
        then is forwarded to the selected service's `/health`. The `service` field in the response
        shows which service answered.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: service
          in: path
          required: true
          description: Gateway route prefix
          schema:
            type: string
            enum: [users, vehicles, telemetry, maps, notifications]
          example: users
      responses:
        '200':
          description: Request routed successfully; body comes from the target service
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimit-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                service: user-service
                db: connected
                uptime: 1532.4
                timestamp: '2026-11-12T10:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/users/register:
    post:
      tags: [Users]
      summary: Register as a driver
      description: Public sign-up. The account always gets the `driver` role; sending `role` is rejected.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Ravi Kumar
              email: ravi@fleet.dev
              password: Driver@123
              phone: '+919876543210'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                user:
                  id: 6730f0c2a1b2c3d4e5f60718
                  name: Ravi Kumar
                  email: ravi@fleet.dev
                  role: driver
                  phone: '+919876543210'
                  isActive: true
                  createdAt: '2026-11-13T09:00:00.000Z'
                  updatedAt: '2026-11-13T09:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/EmailTaken'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/users/login:
    post:
      tags: [Users]
      summary: Log in and receive a JWT
      description: The email is case-insensitive. Wrong email and wrong password return the same 401.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ravi@fleet.dev
              password: Driver@123
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiZHJpdmVyIiwiZW1haWwiOiJyYXZpQGZsZWV0LmRldiIsInN1YiI6IjY3MzBmMGMyYTFiMmMzZDRlNWY2MDcxOCJ9.signature
                tokenType: Bearer
                expiresIn: 3600
                user:
                  id: 6730f0c2a1b2c3d4e5f60718
                  name: Ravi Kumar
                  email: ravi@fleet.dev
                  role: driver
                  phone: '+919876543210'
                  isActive: true
                  lastLoginAt: '2026-11-13T09:15:00.000Z'
                  createdAt: '2026-11-13T09:00:00.000Z'
                  updatedAt: '2026-11-13T09:15:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: API key problem, or wrong email/password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  summary: Wrong email or password
                  value:
                    error:
                      code: INVALID_CREDENTIALS
                      message: Email or password is incorrect
                missingApiKey:
                  summary: No x-api-key header
                  value:
                    error:
                      code: MISSING_API_KEY
                      message: An API key is required in the x-api-key header
        '403':
          description: Account disabled by an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: ACCOUNT_DISABLED
                  message: This account has been disabled
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/users/me:
    get:
      tags: [Users]
      summary: Current user's profile
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        '200':
          description: The logged-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/TokenError'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /api/users:
    get:
      tags: [Users]
      summary: List users (admin)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of users, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/TokenError'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Create a user with any role (admin)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              name: Priya Sharma
              email: priya@fleet.dev
              password: Manager@123
              phone: '+919812345678'
              role: fleet_manager
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/TokenError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/EmailTaken'

  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get a user (admin)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/TokenError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
    patch:
      tags: [Users]
      summary: Update a user's name, phone, role or active status (admin)
      description: An admin cannot change their own `role` or `isActive` (prevents locking yourself out).
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              role: fleet_manager
              phone: '+919811111111'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/TokenError'
        '403':
          description: Not an admin, or trying to change own role/status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    error:
                      code: FORBIDDEN
                      message: 'This action requires one of these roles: admin'
                self:
                  value:
                    error:
                      code: CANNOT_MODIFY_SELF
                      message: You cannot change your own role or status
        '404':
          $ref: '#/components/responses/UserNotFound'

  /api/vehicles:
    get:
      tags: [Vehicles]
      summary: List vehicles (any role)
      description: |
        Filters can be combined. `search` matches the **start** of the registration number, ignoring case,
        spaces and hyphens (`ka 01` finds `KA01AB1234`). `statusHistory` is left out of list items.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/VehicleStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/VehicleType'
        - name: assignedDriver
          in: query
          description: Only vehicles assigned to this driver (user id)
          schema:
            type: string
        - name: search
          in: query
          description: Registration number prefix
          schema:
            type: string
            maxLength: 20
            example: KA01
        - name: sort
          in: query
          description: Sort field; a leading `-` means descending
          schema:
            type: string
            enum:
              [
                createdAt,
                -createdAt,
                updatedAt,
                -updatedAt,
                registrationNumber,
                -registrationNumber,
              ]
            default: -createdAt
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of vehicles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/TokenError'
    post:
      tags: [Vehicles]
      summary: Register a vehicle (admin, fleet_manager)
      description: |
        The registration number is normalised (`ka-01 ab 1234` → `KA01AB1234`) and must be unique.
        New vehicles start with status `idle`; `status` is not accepted here, so use `PATCH /api/vehicles/{id}/status`.
        `assignedDriver` must be an existing, active user with the `driver` role.

        **Address geocoding:** send an `address` without `location` and the coordinates are looked up with
        OpenStreetMap (`locationSource: geocoded`, plus a `geocoding` object in the response). If the address is not
        found or the geocoder is down, the vehicle is still registered without a location
        (`geocoding.status: not_found | unavailable`). Sent coordinates are used as they are (`locationSource: manual`).
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
            examples:
              addressOnly:
                summary: Address only (coordinates are geocoded)
                value:
                  registrationNumber: KA 01 GE 2026
                  model: Mahindra Supro
                  type: van
                  address: Indiranagar, Bengaluru
              withCoordinates:
                summary: Address and coordinates (used as sent)
                value:
                  registrationNumber: KA 01 AB 1234
                  model: Tata Ace Gold
                  type: truck
                  year: 2023
                  address: MG Road, Bengaluru
                  location:
                    lat: 12.9756
                    lng: 77.605
      responses:
        '201':
          description: Vehicle registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/VehicleBadRequest'
        '401':
          $ref: '#/components/responses/TokenError'
        '403':
          $ref: '#/components/responses/VehicleForbidden'
        '409':
          $ref: '#/components/responses/VehicleExists'

  /api/vehicles/{id}:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [Vehicles]
      summary: Get a vehicle with its status history (any role)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        '200':
          description: The vehicle, including `statusHistory`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleDetailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/TokenError'
        '404':
          $ref: '#/components/responses/VehicleNotFound'
    patch:
      tags: [Vehicles]
      summary: Update vehicle details (admin, fleet_manager)
      description: |
        `registrationNumber` and `status` cannot be changed here. Send `null` for
        `address`, `location` or `assignedDriver` to clear it (e.g. unassign the driver).
        A new `address` without `location` is geocoded again (if that fails, the old location stays).
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVehicleRequest'
            examples:
              details:
                summary: Change details and location
                value:
                  model: Tata Ace Gold CNG
                  year: 2024
                  location:
                    lat: 12.9352
                    lng: 77.6245
              newAddress:
                summary: Move to a new address (geocoded)
                value:
                  address: Whitefield, Bengaluru
              unassign:
                summary: Unassign the driver
                value:
                  assignedDriver: null
      responses:
        '200':
          description: Updated vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/VehicleBadRequest'
        '401':
          $ref: '#/components/responses/TokenError'
        '403':
          $ref: '#/components/responses/VehicleForbidden'
        '404':
          $ref: '#/components/responses/VehicleNotFound'
    delete:
      tags: [Vehicles]
      summary: Delete a vehicle (admin only)
      description: Fleet managers and drivers get **403 FORBIDDEN** and the vehicle stays.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        '204':
          description: Deleted (no body)
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/TokenError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/VehicleNotFound'

  /api/vehicles/{id}/status:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    patch:
      tags: [Vehicles]
      summary: Change the operational status (admin, fleet_manager)
      description: |
        If the status really changes, an entry `{ from, to, reason, changedBy, changedAt }` is added to
        `statusHistory` and SMS notifications are sent to admins, fleet managers and the assigned driver
        → `changed: true` plus `notifications: { sent, failed }`.
        If the notification service is unavailable, the status still changes and `notifications` is `null`.
        Sending the current status changes nothing → `changed: false`, no history entry, no SMS.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStatusRequest'
            example:
              status: maintenance
              reason: Scheduled brake service
      responses:
        '200':
          description: Result of the status change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusChangeResponse'
              examples:
                changed:
                  value:
                    vehicle:
                      id: 6731a0c2a1b2c3d4e5f60718
                      registrationNumber: KA01AB1234
                      status: maintenance
                    changed: true
                    change:
                      from: idle
                      to: maintenance
                      reason: Scheduled brake service
                      changedBy: 6730f0c2a1b2c3d4e5f60718
                      changedAt: '2026-11-13T09:30:00.000Z'
                    notifications:
                      sent: 2
                      failed: 1
                unchanged:
                  value:
                    vehicle:
                      id: 6731a0c2a1b2c3d4e5f60718
                      registrationNumber: KA01AB1234
                      status: maintenance
                    changed: false
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/TokenError'
        '403':
          $ref: '#/components/responses/VehicleForbidden'
        '404':
          $ref: '#/components/responses/VehicleNotFound'

  /api/notifications:
    get:
      tags: [Notifications]
      summary: SMS log, newest first (admin, fleet_manager)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [sent, failed]
        - name: type
          in: query
          schema:
            type: string
            enum: [status_change, critical_event]
        - name: vehicleId
          in: query
          description: Only SMS about this vehicle
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/TokenError'
        '403':
          $ref: '#/components/responses/NotificationForbidden'

  /api/notifications/stats:
    get:
      tags: [Notifications]
      summary: Number of SMS per status and type (admin, fleet_manager)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationStats'
        '401':
          $ref: '#/components/responses/TokenError'
        '403':
          $ref: '#/components/responses/NotificationForbidden'

  /api/notifications/{id}:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    get:
      tags: [Notifications]
      summary: One SMS record (admin, fleet_manager)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        '200':
          description: The notification
          content:
            application/json:
              schema:
                type: object
                properties:
                  notification:
                    $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/TokenError'
        '403':
          $ref: '#/components/responses/NotificationForbidden'
        '404':
          description: No notification with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: NOTIFICATION_NOT_FOUND
                  message: Notification not found

  /api/telemetry:
    post:
      tags: [Telemetry]
      summary: Report a reading (any role; drivers only for their assigned vehicle)
      description: |
        Stores the reading and moves the vehicle to `location` if the reading is newer than the vehicle's `lastSeenAt`
        (`vehicleUpdated`). A critical `event` sends an SMS alert to admins and fleet managers (`alert`), unless the same
        vehicle already alerted the same event within the cooldown. The reading is stored even if the SMS fails.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryRequest'
            examples:
              normal:
                summary: Regular position update
                value:
                  vehicleId: 6af717600b7e97513be50437
                  location:
                    lat: 12.9352
                    lng: 77.6245
                  speed: 42.5
                  heading: 90
                  batteryLevel: 78
                  fuelLevel: 55
                  engineTemp: 92
              engineFault:
                summary: Critical event (sends SMS)
                value:
                  vehicleId: 6af717600b7e97513be50437
                  location:
                    lat: 12.9352
                    lng: 77.6245
                  engineTemp: 128
                  event: engine_fault
      responses:
        '201':
          description: Reading stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResult'
              examples:
                normal:
                  value:
                    telemetry:
                      id: 6af7200d50f3e5492d867c01
                      vehicle: 6af717600b7e97513be50437
                      location:
                        lat: 12.9352
                        lng: 77.6245
                      speed: 42.5
                      event: none
                      recordedAt: '2026-11-14T09:15:00.000Z'
                    vehicleUpdated: true
                    alert: null
                alerted:
                  value:
                    telemetry:
                      id: 6af7200d50f3e5492d867c02
                      event: engine_fault
                    vehicleUpdated: true
                    alert:
                      notified: true
                      notifications:
                        sent: 2
                        failed: 1
                cooldown:
                  value:
                    telemetry:
                      id: 6af7200d50f3e5492d867c03
                      event: engine_fault
                    vehicleUpdated: true
                    alert:
                      notified: false
                      reason: cooldown
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/TokenError'
        '403':
          $ref: '#/components/responses/NotAssignedDriver'
        '404':
          $ref: '#/components/responses/VehicleNotFound'

  /api/telemetry/vehicle/{vehicleId}:
    parameters:
      - name: vehicleId
        in: path
        required: true
        schema:
          type: string
          example: 6af717600b7e97513be50437
    get:
      tags: [Telemetry]
      summary: Reading history of one vehicle, newest first (drivers only their own vehicle)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: event
          in: query
          schema:
            $ref: '#/components/schemas/TelemetryEvent'
        - name: from
          in: query
          description: Readings recorded at or after this time
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Readings recorded at or before this time (not before `from`)
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of readings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/TokenError'
        '403':
          $ref: '#/components/responses/NotAssignedDriver'
        '404':
          $ref: '#/components/responses/VehicleNotFound'

  /api/telemetry/events:
    get:
      tags: [Telemetry]
      summary: Critical events across the whole fleet, newest first (admin, fleet_manager)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: event
          in: query
          schema:
            type: string
            enum: [engine_fault, low_battery, emergency_stop]
        - name: vehicleId
          in: query
          schema:
            type: string
        - name: from
          in: query
          description: Readings recorded at or after this time
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Readings recorded at or before this time (not before `from`)
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of critical readings, each with the vehicle's registration number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriticalEventList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/TokenError'
        '403':
          $ref: '#/components/responses/NotificationForbidden'

  /api/maps/geocode:
    get:
      tags: [Maps]
      summary: Address → coordinates (OpenStreetMap Nominatim)
      description: Results are limited to India and cached for 24 hours (`cached`).
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 200
            example: MG Road, Bengaluru
      responses:
        '200':
          description: Coordinates of the best match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodeResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/TokenError'
        '404':
          $ref: '#/components/responses/AddressNotFound'
        '503':
          $ref: '#/components/responses/GeocoderUnavailable'

  /api/maps/reverse:
    get:
      tags: [Maps]
      summary: Coordinates → street address (OpenStreetMap Nominatim)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
            example: 12.9756
        - name: lng
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
            example: 77.6066
      responses:
        '200':
          description: The address at (or nearest to) these coordinates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReverseGeocodeResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/TokenError'
        '404':
          $ref: '#/components/responses/AddressNotFound'
        '503':
          $ref: '#/components/responses/GeocoderUnavailable'

  /api/maps/nearby:
    get:
      tags: [Maps]
      summary: Vehicles within X km of a point or an address, nearest first
      description: |
        Give the centre either as `lat` + `lng`, **or** as an `address` (geocoded first) — not both.
        Vehicles without a location are never included.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: lat
          in: query
          schema:
            type: number
            minimum: -90
            maximum: 90
            example: 12.9756
        - name: lng
          in: query
          schema:
            type: number
            minimum: -180
            maximum: 180
            example: 77.605
        - name: address
          in: query
          description: Instead of lat/lng
          schema:
            type: string
            example: Koramangala, Bengaluru
        - name: radiusKm
          in: query
          schema:
            type: number
            minimum: 0.1
            maximum: 100
            default: 5
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/VehicleStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/VehicleType'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Vehicles inside the radius with their distance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/TokenError'
        '404':
          $ref: '#/components/responses/AddressNotFound'
        '503':
          $ref: '#/components/responses/GeocoderUnavailable'

  /api/maps/vehicles:
    get:
      tags: [Maps]
      summary: Positions of all vehicles that have a location (for a map)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/VehicleStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/VehicleType'
      responses:
        '200':
          description: Vehicle positions, sorted by registration number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapVehicleList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/TokenError'

components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: User id (24-character hex)
      schema:
        type: string
        example: 6730f0c2a1b2c3d4e5f60718
    VehicleId:
      name: id
      in: path
      required: true
      description: Vehicle id (24-character hex)
      schema:
        type: string
        example: 6731a0c2a1b2c3d4e5f60718
    NotificationId:
      name: id
      in: path
      required: true
      description: Notification id (24-character hex)
      schema:
        type: string
        example: 6731b5e2a1b2c3d4e5f60799
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Required on every `/api/*` request. Verified by the gateway.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from `POST /api/users/login`. Verified by the backend services.

  headers:
    X-Request-Id:
      description: Unique request ID (generated by the gateway, or the one sent by the client)
      schema:
        type: string
        example: 3f2b8c1e-7d4a-4b9e-9a51-2c6d8e0f1a23
    RateLimit:
      description: Remaining quota for this API key (IETF draft-8 format)
      schema:
        type: string
        example: '"100-in-15min"; r=97; t=845'
    RateLimit-Policy:
      description: Rate limit policy for this API key
      schema:
        type: string
        example: '"100-in-15min"; q=100; w=900'
    Retry-After:
      description: Seconds to wait before retrying
      schema:
        type: integer
        example: 845

  responses:
    Unauthorized:
      description: API key missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              summary: No x-api-key header
              value:
                error:
                  code: MISSING_API_KEY
                  message: An API key is required in the x-api-key header
            invalid:
              summary: Wrong API key
              value:
                error:
                  code: INVALID_API_KEY
                  message: The API key is not valid
    NotFound:
      description: Unknown route
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Route GET /api/unknown not found
    TooManyRequests:
      description: Rate limit exceeded for this API key
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMITED
              message: Too many requests. Limit is 100 per 900s; retry in 845s
    ServiceUnavailable:
      description: The target service is not reachable (e.g. its container is stopped)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: vehicle-service is currently unavailable
              details:
                service: vehicle-service
    GatewayTimeout:
      description: The target service did not respond within the gateway timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: GATEWAY_TIMEOUT
              message: vehicle-service did not respond in time
              details:
                service: vehicle-service

    ValidationError:
      description: Request body, query or path parameter is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - location: body
                  field: password
                  message: password must contain at least one number
                - location: body
                  field: phone
                  message: phone must be in international format, e.g. +919876543210
    TokenError:
      description: API key problem, or JWT missing / invalid / expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              summary: No Bearer token
              value:
                error:
                  code: TOKEN_MISSING
                  message: A Bearer token is required in the Authorization header
            invalid:
              summary: Bad signature / malformed
              value:
                error:
                  code: TOKEN_INVALID
                  message: The token is invalid
            expired:
              summary: Token expired
              value:
                error:
                  code: TOKEN_EXPIRED
                  message: The token has expired, please log in again
    Forbidden:
      description: Logged in, but the role is not allowed to do this
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: 'This action requires one of these roles: admin'
    UserNotFound:
      description: No user with this id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: USER_NOT_FOUND
              message: User not found
    EmailTaken:
      description: Email already registered
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: EMAIL_TAKEN
              message: An account with this email already exists
    VehicleNotFound:
      description: No vehicle with this id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VEHICLE_NOT_FOUND
              message: Vehicle not found
    VehicleExists:
      description: Registration number already registered
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VEHICLE_EXISTS
              message: A vehicle with registration number KA01AB1234 already exists
    VehicleForbidden:
      description: Logged in, but drivers cannot modify vehicles
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: 'This action requires one of these roles: admin, fleet_manager'
    VehicleBadRequest:
      description: Invalid input, or `assignedDriver` is not an active driver
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Request validation failed
                  details:
                    - location: body
                      field: registrationNumber
                      message: registrationNumber must be a valid registration number, e.g. KA01AB1234
            invalidDriver:
              value:
                error:
                  code: INVALID_DRIVER
                  message: assignedDriver must be an existing, active user with the driver role
    NotificationForbidden:
      description: Drivers cannot read the SMS log
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: 'This action requires one of these roles: admin, fleet_manager'
    NotAssignedDriver:
      description: A driver tried to use a vehicle that is not assigned to them (or the role is not allowed)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_ASSIGNED_DRIVER
              message: Drivers can only access their assigned vehicle
    AddressNotFound:
      description: OpenStreetMap has no match for this address / these coordinates
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: ADDRESS_NOT_FOUND
              message: No location found for "Xyzzy Qwertyville 99999"
    GeocoderUnavailable:
      description: Nominatim is down, too slow (timeout) or rate-limiting us
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: GEOCODER_UNAVAILABLE
              message: The geocoding service is unavailable, try again later

  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          example: user-service
        db:
          type: string
          enum: [connected, disconnected, connecting, disconnecting, not_used]
        uptime:
          type: number
          description: Seconds since the process started
        timestamp:
          type: string
          format: date-time
    ServicesHealth:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        services:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: vehicle-service
              status:
                type: string
                enum: [up, degraded, down]
              db:
                type: string
                example: connected
              responseTimeMs:
                type: integer
                example: 4
        timestamp:
          type: string
          format: date-time
    Role:
      type: string
      enum: [admin, fleet_manager, driver]
    User:
      type: object
      properties:
        id:
          type: string
          example: 6730f0c2a1b2c3d4e5f60718
        name:
          type: string
          example: Ravi Kumar
        email:
          type: string
          format: email
          example: ravi@fleet.dev
        role:
          $ref: '#/components/schemas/Role'
        phone:
          type: string
          example: '+919876543210'
        isActive:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
    UserList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 3
    RegisterRequest:
      type: object
      required: [name, email, password]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: At least one letter and one number
        phone:
          type: string
          pattern: '^\+[1-9]\d{7,14}$'
          description: International (E.164) format, used for SMS alerts
    CreateUserRequest:
      allOf:
        - $ref: '#/components/schemas/RegisterRequest'
        - type: object
          required: [role]
          properties:
            role:
              $ref: '#/components/schemas/Role'
    UpdateUserRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
        phone:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        isActive:
          type: boolean
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: 'JWT — send as `Authorization: Bearer <token>`'
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Seconds until the token expires
          example: 3600
        user:
          $ref: '#/components/schemas/User'
    VehicleType:
      type: string
      enum: [truck, van, car, bike, bus]
    VehicleStatus:
      type: string
      enum: [active, idle, maintenance, inactive]
    LatLng:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
          example: 12.9756
        lng:
          type: number
          minimum: -180
          maximum: 180
          example: 77.605
    Vehicle:
      type: object
      properties:
        id:
          type: string
          example: 6731a0c2a1b2c3d4e5f60718
        registrationNumber:
          type: string
          example: KA01AB1234
        model:
          type: string
          example: Tata Ace Gold
        type:
          $ref: '#/components/schemas/VehicleType'
        year:
          type: integer
          example: 2023
        status:
          $ref: '#/components/schemas/VehicleStatus'
        address:
          type: string
          example: MG Road, Bengaluru
        location:
          allOf:
            - $ref: '#/components/schemas/LatLng'
          nullable: true
          description: Stored as a GeoJSON point (2dsphere index) and returned as lat/lng
        locationSource:
          type: string
          enum: [manual, geocoded, telemetry]
          nullable: true
          description: Where the location came from — sent by a user, looked up from `address`, or reported by GPS
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: Last telemetry update (Phase 6)
        assignedDriver:
          type: string
          nullable: true
          description: User id of the assigned driver
        createdBy:
          type: string
          description: User id of whoever registered the vehicle
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StatusChange:
      type: object
      properties:
        from:
          $ref: '#/components/schemas/VehicleStatus'
        to:
          $ref: '#/components/schemas/VehicleStatus'
        reason:
          type: string
          example: Scheduled brake service
        changedBy:
          type: string
          description: User id
        changedAt:
          type: string
          format: date-time
    VehicleDetail:
      allOf:
        - $ref: '#/components/schemas/Vehicle'
        - type: object
          properties:
            statusHistory:
              type: array
              description: Oldest first
              items:
                $ref: '#/components/schemas/StatusChange'
    VehicleResponse:
      type: object
      properties:
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        geocoding:
          $ref: '#/components/schemas/GeocodingStatus'
    GeocodingStatus:
      type: object
      description: Only present when an address was geocoded (address sent without `location`)
      properties:
        status:
          type: string
          enum: [ok, not_found, unavailable]
        displayName:
          type: string
          description: Full place name from OpenStreetMap (only when `ok`)
          example: Indiranagar, Bengaluru East City Corporation, Bengaluru, Karnataka, India
    VehicleDetailResponse:
      type: object
      properties:
        vehicle:
          $ref: '#/components/schemas/VehicleDetail'
    VehicleList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 7
    CreateVehicleRequest:
      type: object
      required: [registrationNumber, model, type]
      additionalProperties: false
      properties:
        registrationNumber:
          type: string
          description: Indian format, spaces/hyphens allowed (normalised to e.g. KA01AB1234)
          example: KA 01 AB 1234
        model:
          type: string
          minLength: 2
          maxLength: 100
        type:
          $ref: '#/components/schemas/VehicleType'
        year:
          type: integer
          minimum: 1990
        address:
          type: string
          maxLength: 200
        location:
          $ref: '#/components/schemas/LatLng'
        assignedDriver:
          type: string
          description: User id of an active driver
    UpdateVehicleRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        model:
          type: string
        type:
          $ref: '#/components/schemas/VehicleType'
        year:
          type: integer
        address:
          type: string
          nullable: true
        location:
          allOf:
            - $ref: '#/components/schemas/LatLng'
          nullable: true
        assignedDriver:
          type: string
          nullable: true
    ChangeStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/VehicleStatus'
        reason:
          type: string
          maxLength: 200
    StatusChangeResponse:
      type: object
      properties:
        vehicle:
          $ref: '#/components/schemas/VehicleDetail'
        changed:
          type: boolean
        change:
          $ref: '#/components/schemas/StatusChange'
        notifications:
          type: object
          nullable: true
          description: SMS sent for this change; `null` if the notification service was unavailable
          properties:
            sent:
              type: integer
              example: 2
            failed:
              type: integer
              example: 1
    Notification:
      type: object
      properties:
        id:
          type: string
          example: 6731b5e2a1b2c3d4e5f60799
        type:
          type: string
          enum: [status_change, critical_event]
        vehicle:
          type: string
          description: Vehicle id
        vehicleRegistration:
          type: string
          example: KA01AB1234
        recipientUser:
          type: string
          description: User id
        recipientRole:
          $ref: '#/components/schemas/Role'
        recipientPhone:
          type: string
          example: '+919812345678'
        message:
          type: string
          example: '[Fleet] KA01AB1234 status: idle -> maintenance (Scheduled brake service)'
        provider:
          type: string
          example: mock
        providerMessageId:
          type: string
          description: Only when sent
          example: MOCK-72bb0ebc-729a-43fa-a95e-ae2734c1d2f0
        status:
          type: string
          enum: [sent, failed]
        error:
          type: string
          description: Only when failed
          example: 'Mock SMS: number unreachable'
        details:
          type: object
          description: 'Event data: `{ from, to, reason }` for a status change, `{ event, location }` for a critical event'
        sentAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NotificationList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 8
    NotificationStats:
      type: object
      properties:
        total:
          type: integer
          example: 8
        byStatus:
          type: object
          properties:
            sent:
              type: integer
              example: 6
            failed:
              type: integer
              example: 2
        byType:
          type: object
          properties:
            status_change:
              type: integer
              example: 8
            critical_event:
              type: integer
              example: 0
    TelemetryEvent:
      type: string
      enum: [none, engine_fault, low_battery, emergency_stop]
    TelemetryRequest:
      type: object
      required: [vehicleId, location]
      additionalProperties: false
      properties:
        vehicleId:
          type: string
        location:
          $ref: '#/components/schemas/LatLng'
        speed:
          type: number
          minimum: 0
          maximum: 300
          description: km/h
        heading:
          type: number
          minimum: 0
          maximum: 359.99
          description: degrees, 0 = north
        batteryLevel:
          type: number
          minimum: 0
          maximum: 100
          description: '%'
        fuelLevel:
          type: number
          minimum: 0
          maximum: 100
          description: '%'
        engineTemp:
          type: number
          minimum: -40
          maximum: 200
          description: °C
        event:
          allOf:
            - $ref: '#/components/schemas/TelemetryEvent'
          default: none
        recordedAt:
          type: string
          format: date-time
          description: Device time (default now); at most 5 minutes in the future
    Telemetry:
      type: object
      properties:
        id:
          type: string
        vehicle:
          type: string
        location:
          $ref: '#/components/schemas/LatLng'
        speed:
          type: number
        heading:
          type: number
        batteryLevel:
          type: number
        fuelLevel:
          type: number
        engineTemp:
          type: number
        event:
          $ref: '#/components/schemas/TelemetryEvent'
        recordedAt:
          type: string
          format: date-time
        reportedBy:
          type: string
          description: User id
        alertSentAt:
          type: string
          format: date-time
          description: Present when this reading triggered an SMS alert
        createdAt:
          type: string
          format: date-time
    TelemetryResult:
      type: object
      properties:
        telemetry:
          $ref: '#/components/schemas/Telemetry'
        vehicleUpdated:
          type: boolean
          description: false when the reading is older than the vehicle's last known position
        alert:
          type: object
          nullable: true
          description: '`null` for `event: none`'
          properties:
            notified:
              type: boolean
            reason:
              type: string
              enum: [cooldown]
            notifications:
              type: object
              nullable: true
              description: '`null` if the notification service was unavailable'
              properties:
                sent:
                  type: integer
                failed:
                  type: integer
    TelemetryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Telemetry'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
    CriticalEventList:
      type: object
      properties:
        data:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Telemetry'
              - type: object
                properties:
                  vehicleRegistration:
                    type: string
                    nullable: true
                    example: KA01DM2026
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
    GeocodeResult:
      type: object
      properties:
        query:
          type: string
          example: MG Road, Bengaluru
        lat:
          type: number
          example: 12.9755264
        lng:
          type: number
          example: 77.6067902
        displayName:
          type: string
          example: Mahatma Gandhi Road, Ashokanagar, Bengaluru, Karnataka, 560001, India
        cached:
          type: boolean
          description: true when answered from the 24-hour cache (no call to Nominatim)
        source:
          type: string
          example: OpenStreetMap Nominatim
    ReverseGeocodeResult:
      type: object
      properties:
        lat:
          type: number
          example: 12.9756
        lng:
          type: number
          example: 77.6066
        displayName:
          type: string
          example: Mahatma Gandhi Road, Ashok Nagar, Bengaluru, Karnataka, 560001, India
        address:
          type: object
          description: Address parts as returned by Nominatim (road, suburb, city, postcode, …)
          additionalProperties:
            type: string
          example:
            road: Mahatma Gandhi Road
            suburb: Ashokanagar
            city: Bengaluru
            state: Karnataka
            postcode: '560001'
            country: India
        cached:
          type: boolean
        source:
          type: string
          example: OpenStreetMap Nominatim
    MapVehicle:
      type: object
      properties:
        id:
          type: string
        registrationNumber:
          type: string
          example: KA01DM2029
        model:
          type: string
        type:
          $ref: '#/components/schemas/VehicleType'
        status:
          $ref: '#/components/schemas/VehicleStatus'
        address:
          type: string
          nullable: true
        location:
          $ref: '#/components/schemas/LatLng'
        locationSource:
          type: string
          enum: [manual, geocoded, telemetry]
          nullable: true
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        assignedDriver:
          type: string
          nullable: true
    NearbyResult:
      type: object
      properties:
        center:
          type: object
          properties:
            lat:
              type: number
              example: 12.9756
            lng:
              type: number
              example: 77.605
            displayName:
              type: string
              description: Only when the centre was given as an address
        radiusKm:
          type: number
          example: 5
        count:
          type: integer
          example: 4
        vehicles:
          type: array
          description: Nearest first
          items:
            allOf:
              - $ref: '#/components/schemas/MapVehicle'
              - type: object
                properties:
                  distanceKm:
                    type: number
                    example: 1.31
    MapVehicleList:
      type: object
      properties:
        count:
          type: integer
          example: 9
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/MapVehicle'
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
              example: Route GET /xyz not found
            details:
              description: Optional extra information (e.g. validation errors, failing service)
